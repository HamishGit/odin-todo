<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
</head>
<body>
    <dialog id="create-todo">
        <form id="create-todo-form">
            <div class="form-item">
                <label for="title">Title</label>
                <input type="text" id="title">
            </div>
            <div class="form-item">
                <label for="desc">Description</label>
                <input type="text" id="desc">
            </div>
            <div class="form-item">
                <label for="due-date">Due Date</label>
                <input type="date" name="" id="due-date">
            </div>
            <div class="form-item">
                <label for="priority">Priority</label>
                <select name="priority" id="priority">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="form-item">
                <label for="notes">Notes</label>
                <textarea name="notes" id="notes"></textarea>
            </div>
            <button type="submit">Add</button>
            <button type="button" id="close">Close</button>
            <button type="button" id="delete-todo-btn">Delete</button>
        </form>
    </dialog>
    <div class="grid-container">
        <aside id="sidebar">
            <section class="projects">
                <h3>My Project</h3>
                <h3>My Other Project</h3>
                <h3>Music</h3>
            </section>
            <section class="footer">
                <p>New Project</p>
            </section>
        </aside>
        <main id="content">
            <div class="project">
                <section class="header" id="project-header">
                    <h1></h1>
                </section>
                <section class="list" id="todo-list">
                </section>
            </div>
            <div class="footer">
                <button id="add-new-todo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                </button>
            </div>
        </main>
    </div>
</body>
</html>
